<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">

<title>Вячеслав — массаж в Варне</title>
<style>
:root{--bg:#0b0b0b;--panel:#161616;--text:#f6f3ed;--muted:#aaa49b;--gold:#dfb76c;--gold2:#f1d89e;--line:rgba(223,183,108,.26)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Arial,sans-serif}body{height:100dvh}a,button{font:inherit;touch-action:manipulation}.app{width:100vw;height:100dvh;overflow:hidden;display:grid;grid-template-rows:39dvh 1fr;background:linear-gradient(180deg,#090909,#101010)}
.hero{position:relative;overflow:hidden;background:#17120d}.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:36% 50%;display:block}.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05) 25%,rgba(0,0,0,.22) 55%,rgba(0,0,0,.86) 100%)}
.badge{position:absolute;z-index:2;right:14px;top:max(12px,env(safe-area-inset-top));padding:8px 11px;border:1px solid rgba(241,216,158,.42);border-radius:999px;background:rgba(0,0,0,.44);backdrop-filter:blur(8px);color:var(--gold2);font-size:11px;font-weight:750}.brand{position:absolute;z-index:2;left:16px;right:16px;bottom:13px;text-shadow:0 6px 24px #000}.kicker{margin:0 0 5px;color:#e8d0a0;font-size:10px;letter-spacing:2px;text-transform:uppercase;font-weight:700}h1{margin:0;font-size:clamp(34px,10vw,48px);line-height:.92;letter-spacing:-1.6px;font-weight:780}h1 span{display:block;margin-top:5px;color:var(--gold2);font-size:.66em;font-weight:680;letter-spacing:-.5px}
.content{min-height:0;padding:9px 10px max(9px,env(safe-area-inset-bottom));display:grid;grid-template-rows:auto auto auto 1fr;gap:7px}.services{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.service{min-width:0;text-decoration:none;color:var(--text);background:linear-gradient(180deg,#1a1a1a,#121212);border:1px solid var(--line);border-radius:14px;padding:9px 6px;text-align:center}.service:active,.btn:active{transform:scale(.985)}.service-title{font-size:11px;line-height:1.05;font-weight:760}.service-time{margin-top:4px;color:var(--muted);font-size:9px}.service-price{margin-top:6px;color:var(--gold2);font-size:20px;line-height:1;font-weight:850}
.btn{border:0;text-decoration:none;display:flex;align-items:center;justify-content:center;text-align:center;border-radius:15px;cursor:pointer}.book{height:50px;background:linear-gradient(180deg,#efd292,#d8aa57);color:#0a0a0a;font-size:17px;font-weight:820;box-shadow:0 8px 28px rgba(223,183,108,.17)}.quick{display:grid;grid-template-columns:1fr 1fr;gap:7px}.quick .btn{min-height:43px;padding:0 9px;background:#171717;border:1px solid #2c2c2c;color:#f3f0e9;font-size:12px;font-weight:680;line-height:1.12}.phone{grid-column:1/-1;min-height:45px!important;font-size:14px!important;color:var(--gold2)!important}
.meta{min-height:0;align-self:end;display:flex;justify-content:space-between;gap:12px;padding:0 2px;color:#8f8b84;font-size:9px;line-height:1.2}.meta strong{color:#d9d5cd;font-size:10px}.toast{position:fixed;z-index:10;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translate(-50%,18px);opacity:0;pointer-events:none;padding:9px 12px;border-radius:999px;background:#fff;color:#111;font-size:11px;font-weight:800;transition:.2s;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-height:720px){.app{grid-template-rows:36dvh 1fr}.content{gap:5px;padding-top:6px}.service{padding:6px 4px}.service-title{font-size:10px}.service-price{font-size:18px;margin-top:5px}.book{height:44px;font-size:15px}.quick .btn{min-height:38px;font-size:11px}.phone{min-height:40px!important;font-size:13px!important}h1{font-size:34px}}
</style>
</head>
<body>
<main class="app">
<section class="hero">
<img src="Hero.png" alt="Вячеслав — массаж в Варне">
<div class="badge">24 года практики</div>
<div class="brand"><p class="kicker">Варна · индивидуальный массаж</p><h1>Вячеслав<span>Массаж Варна</span></h1></div>
</section>
<section class="content">
<div class="services">
<a class="service" href="https://t.me/vycheslavBG" target="_blank" rel="noopener"><div class="service-title">Массаж спины</div><div class="service-time">40 минут</div><div class="service-price">30 €</div></a>
<a class="service" href="https://t.me/vycheslavBG" target="_blank" rel="noopener"><div class="service-title">Общий массаж</div><div class="service-time">60 минут</div><div class="service-price">40 €</div></a>
<a class="service" href="https://t.me/vycheslavBG" target="_blank" rel="noopener"><div class="service-title">Общий массаж</div><div class="service-time">90 минут</div><div class="service-price">50 €</div></a>
</div>
<a class="btn book" href="https://t.me/vycheslavBG" target="_blank" rel="noopener">Записаться в Telegram</a>
<div class="quick">
<a class="btn phone" href="tel:+359888815220">Позвонить · +359 888 815 220</a>
<a class="btn" href="https://instagram.com/slavmasaj" target="_blank" rel="noopener">Instagram · @slavmasaj</a>
<button class="btn" id="shareBtn" type="button">Поделиться визиткой</button>
</div>
<div class="meta"><div><strong>+359 888 815 220</strong><br>телефон</div><div style="text-align:right"><strong>@slavmasaj</strong><br>Варна, Болгария</div></div>
</section>
</main>
<div class="toast" id="toast">Ссылка скопирована</div>
<script>
const b=document.getElementById('shareBtn'),t=document.getElementById('toast');function toast(x){t.textContent=x;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1600)}b.addEventListener('click',async()=>{const d={title:'Вячеслав — массаж в Варне',text:'Массаж в Варне · 24 года практики',url:location.href};try{if(navigator.share)await navigator.share(d);else if(navigator.clipboard){await navigator.clipboard.writeText(location.href);toast('Ссылка скопирована')}}catch(e){}});if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script>
</body></html>
