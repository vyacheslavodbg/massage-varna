<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Вячеслав — массаж в Варне</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0c0c0c;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
.page{max-width:760px;margin:auto;padding:14px}
.poster{width:100%;display:block;border-radius:20px}
.buttons{display:grid;gap:12px;margin:14px 0}
a{display:block;text-decoration:none;text-align:center;padding:16px;border-radius:13px;font-weight:800;font-size:17px}
.telegram{background:#168eea;color:white}
.call{background:#fff;color:#111}
.info{background:#1b1b1b;border-radius:18px;padding:20px;margin-top:14px}
h2{margin:0 0 14px}
.price{display:flex;justify-content:space-between;padding:13px 0;border-bottom:1px solid #333}
.price:last-child{border:0}
.note{color:#aaa;font-size:14px;line-height:1.45}
</style>
</head>
<body>
<main class="page">
<img class="poster" src="Hero.png" alt="Массаж в Варне — Вячеслав">
<div class="buttons">
<a class="telegram" href="https://t.me/vycheslavBG">ЗАПИСАТЬСЯ В TELEGRAM</a>
<a class="call" href="tel:+359888815220">Позвонить</a>
</div>
<section class="info">
<h2>Услуги</h2>
<div class="price"><span>Массаж спины · 40 минут</span><b>30 €</b></div>
<div class="price"><span>Общий массаж · 60 минут</span><b>40 €</b></div>
<div class="price"><span>Общий массаж · 80 минут</span><b>50 €</b></div>
</section>
<section class="info">
<h2>Запись через Telegram</h2>
<p class="note">Сюда можно подключить Telegram-бота, а затем AI-ассистента для ответов клиентам, уточнения услуги, даты и времени и передачи заявки.</p>
</section>
</main>
</body>
</html>
