<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#090909">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Массаж Варна">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Вячеслав — массаж в Варне</title>
<meta name="description" content="Вячеслав — массаж в Варне. 24 года практики. Запись в Telegram.">
<style>
:root{--bg:#090909;--panel:#151515;--text:#fff;--muted:#aaa59d;--gold:#e3b45f;--gold2:#f4d79a;--line:rgba(227,180,95,.32)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Arial,sans-serif}
body{height:100dvh}
a,button{touch-action:manipulation}
.app{width:100vw;height:100dvh;overflow:hidden;display:grid;grid-template-rows:43dvh 1fr;background:linear-gradient(180deg,#080808,#111)}
.hero{position:relative;overflow:hidden;min-height:0;background:#17120d}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:32% 50%;display:block}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.02) 35%,rgba(0,0,0,.80) 100%)}
.badge{position:absolute;z-index:2;right:14px;top:max(14px,env(safe-area-inset-top));padding:8px 10px;border-radius:999px;border:1px solid rgba(255,218,151,.45);background:rgba(0,0,0,.42);backdrop-filter:blur(8px);font-size:10px;font-weight:800;color:#f5ddb1;letter-spacing:.4px}
.brand{position:absolute;z-index:2;left:16px;right:16px;bottom:14px;text-shadow:0 3px 18px #000}
.kicker{color:#efd39e;font-size:10px;letter-spacing:2.2px;text-transform:uppercase;font-weight:750;margin-bottom:5px}
h1{margin:0;font-size:clamp(34px,10.5vw,52px);line-height:.88;letter-spacing:-1.8px}
h1 span{display:block;color:var(--gold2);font-size:.65em;margin-top:5px;letter-spacing:-.7px}
.content{min-height:0;overflow:hidden;padding:9px 10px max(9px,env(safe-area-inset-bottom));display:grid;grid-template-rows:auto auto auto 1fr;gap:7px;background:radial-gradient(circle at 80% 15%,rgba(227,180,95,.08),transparent 30%),#0d0d0d}
.services{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.service{min-width:0;text-decoration:none;color:#fff;background:linear-gradient(180deg,#1a1a1a,#111);border:1px solid var(--line);border-radius:14px;padding:9px 5px;text-align:center;display:flex;flex-direction:column;justify-content:center}
.service:active{transform:scale(.98)}
.name{font-size:11px;line-height:1.05;font-weight:800}
.time{font-size:9px;color:var(--muted);margin-top:4px}
.price{font-size:21px;color:var(--gold2);font-weight:900;line-height:1;margin-top:7px}
.book{height:52px;border-radius:16px;background:linear-gradient(180deg,#f4d28d,#dda94b);color:#080808;text-decoration:none;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:950;box-shadow:0 7px 25px rgba(227,180,95,.16)}
.book:active{transform:scale(.985)}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.quick a,.quick button{border:1px solid #2d2d2d;background:#171717;color:#f5f5f5;text-decoration:none;border-radius:12px;height:43px;padding:0 4px;font:inherit;font-size:9px;font-weight:800;display:flex;align-items:center;justify-content:center;text-align:center;cursor:pointer}
.quick a:active,.quick button:active{background:#242424;transform:scale(.98)}
.meta{min-height:0;align-self:end;display:flex;justify-content:space-between;align-items:end;gap:10px;color:#8e8a83;font-size:9px;line-height:1.25}
.meta strong{color:#dcd7cc;font-size:10px}
.toast{position:fixed;z-index:20;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translate(-50%,18px);opacity:0;pointer-events:none;background:#fff;color:#111;padding:9px 12px;border-radius:999px;font-size:11px;font-weight:850;transition:.2s;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-height:760px){.app{grid-template-rows:39dvh 1fr}.content{gap:5px;padding-top:6px}.service{padding:6px 4px}.name{font-size:10px}.time{font-size:8px}.price{font-size:18px;margin-top:5px}.book{height:45px;font-size:16px}.quick a,.quick button{height:37px;font-size:8px}h1{font-size:35px}}
@media(max-width:350px){.content{padding-left:7px;padding-right:7px}.services,.quick{gap:4px}.service{border-radius:11px}.price{font-size:17px}}
</style>
</head>
<body>
<main class="app">
<section class="hero">
<img src="massage-varna.jpg" alt="Вячеслав — массажист в Варне">
<div class="badge">24 ГОДА ПРАКТИКИ</div>
<div class="brand"><div class="kicker">Варна · индивидуальный массаж</div><h1>ВЯЧЕСЛАВ<span>МАССАЖ ВАРНА</span></h1></div>
</section>
<section class="content">
<div class="services">
<a class="service" href="https://t.me/vycheslavBG" target="_blank" rel="noopener"><div class="name">Массаж спины</div><div class="time">40 минут</div><div class="price">30 €</div></a>
<a class="service" href="https://t.me/vycheslavBG" target="_blank" rel="noopener"><div class="name">Общий массаж</div><div class="time">60 минут</div><div class="price">40 €</div></a>
<a class="service" href="https://t.me/vycheslavBG" target="_blank" rel="noopener"><div class="name">Общий массаж</div><div class="time">90 минут</div><div class="price">50 €</div></a>
</div>
<a class="book" href="https://t.me/vycheslavBG" target="_blank" rel="noopener">ЗАПИСАТЬСЯ</a>
<nav class="quick">
<a href="tel:+359894961120">ПОЗВОНИТЬ</a>
<a href="https://t.me/vycheslavBG" target="_blank" rel="noopener">TELEGRAM</a>
<a href="https://instagram.com/slavmasaj" target="_blank" rel="noopener">INSTAGRAM</a>
<button type="button" id="shareBtn">ПОДЕЛИТЬСЯ</button>
</nav>
<div class="meta"><div><strong>+359 89 496 1120</strong><br>Telegram / телефон</div><div style="text-align:right"><strong>@slavmasaj</strong><br>Варна, Болгария</div></div>
</section>
</main>
<div class="toast" id="toast">Ссылка скопирована</div>
<script>
const shareBtn=document.getElementById('shareBtn'),toast=document.getElementById('toast');
function showToast(t){toast.textContent=t;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1600)}
shareBtn.addEventListener('click',async()=>{const d={title:'Вячеслав — массаж в Варне',text:'Массаж в Варне · 24 года практики',url:location.href};try{if(navigator.share){await navigator.share(d)}else if(navigator.clipboard){await navigator.clipboard.writeText(location.href);showToast('Ссылка скопирована')}else{showToast('Скопируй адрес страницы')}}catch(e){}});
if('serviceWorker'in navigator){addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
</script>
</body>
</html>
